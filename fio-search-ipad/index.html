<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json"><title>Пошук ПІБ</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f7fb;color:#172033;padding:14px} .wrap{max-width:1100px;margin:auto}h1{font-size:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid #d9e2ef;border-radius:16px;padding:16px}.box{height:250px;overflow:auto;border:1px solid #cbd6e5;border-radius:12px;background:#fbfdff}.person{padding:9px 11px;border-bottom:1px solid #edf2f7;cursor:pointer}textarea,input,button{font-size:17px}input[type=file],textarea{width:100%;box-sizing:border-box}textarea{min-height:250px;border:1px solid #b8c5d5;border-radius:12px;padding:10px}.actions{text-align:center;margin:16px 0}button{border:0;border-radius:12px;background:#138a47;color:#fff;font-weight:700;padding:12px 22px}.status{min-height:24px;margin:8px 0}.error{color:#a20e0e;font-weight:700}.table{overflow:auto;background:#fff;border:1px solid #d9e2ef;border-radius:16px}table{border-collapse:collapse;width:100%;min-width:820px}th,td{padding:10px;border-bottom:1px solid #e7edf5;text-align:left}th{background:#f7f9fc}@media(max-width:820px){.grid{grid-template-columns:1fr}.box,textarea{height:190px;min-height:190px}button{width:100%}}
</style>
</head>
<body><div class="wrap">
<h1>Пошук ПІБ в Excel</h1>
<div class="grid">
<section class="card"><h2>1. База Excel</h2><p>Виберіть .xlsx або .xls. ПІБ з'являться нижче.</p><input id="excel" type="file" accept=".xlsx,.xls"><div id="fileInfo"></div><div id="peopleBox" class="box"><div class="person">Список ПІБ з'явиться тут</div></div></section>
<section class="card"><h2>2. ПІБ для пошуку</h2><p>Введіть вручну або завантажте список .txt, .csv, .xlsx, .xls.</p><input id="queryFile" type="file" accept=".txt,.csv,.xlsx,.xls"><button id="loadList" type="button">Завантажити список</button><textarea id="queries" placeholder="Пархоменко О. О.&#10;Гмиря О. В."></textarea></section>
</div>
<div class="actions"><button id="start">СТАРТ</button></div><div id="status" class="status"></div>
<div class="table"><table><thead><tr><th>№</th><th>ПІБ для пошуку</th><th>Знайдене ПІБ</th><th>Кількість</th><th>Статус</th></tr></thead><tbody id="results"></tbody></table></div>
</div>
<script>
let PEOPLE=[]; const $=id=>document.getElementById(id); const excel=$('excel'),queries=$('queries'),peopleBox=$('peopleBox'),statusBox=$('status'),results=$('results');
const aliases={fio:['фио','пиб','піб','full name','fullname'],surname:['фамилия','прізвище','surname','last name','lastname'],name:['имя','ім\'я','ім’я','first name','firstname','given name'],patronymic:['отчество','по батькові','patronymic','middle name','middlename']};
function norm(v){return String(v??'').trim().toLowerCase().replace(/ё/g,'е').replace(/’|`/g,"'").replace(/\s+/g,' ')}
function toks(v){return norm(v).match(/[^\W\d_]+(?:[-'][^\W\d_]+)*/gu)||[]}
function parsePerson(v){const raw=String(v??'').trim();const a=raw.match(/[^\W\d_]+(?:[-'][^\W\d_]+)*/gu)||[];const n=toks(v);return{surname:n[0]||'',name:n[1]||'',patronymic:n[2]||'',ds:a[0]||'',dn:a[1]||'',dp:a[2]||''}}
function disp(p){return [p.ds||p.surname,p.dn||p.name,p.dp||p.patronymic].filter(Boolean).join(' ')}
function findHeader(cols,kind){const aa=aliases[kind].map(norm);for(const c of cols){if(aa.includes(norm(c)))return c}for(const c of cols){const x=norm(c);if(aa.some(a=>a.length>=3&&x.includes(a)))return c}return null}
function rowsToPeople(rows){if(!rows.length)return[];const cols=Object.keys(rows[0]||{});const s=findHeader(cols,'surname'),n=findHeader(cols,'name'),p=findHeader(cols,'patronymic');let out=[];if(s&&n){for(const r of rows){if(r[s]!=null&&String(r[s]).trim()){out.push({surname:norm(r[s]),name:norm(r[n]),patronymic:p?norm(r[p]):'',ds:String(r[s]).trim(),dn:r[n]==null?'':String(r[n]).trim(),dp:p&&r[p]!=null?String(r[p]).trim():''})}}return out}
let best=null,score=-1;for(const c of cols){const vals=rows.slice(0,250).map(r=>r[c]).filter(v=>v!=null&&String(v).trim());if(!vals.length)continue;const sc=vals.filter(v=>toks(v).length>=2).length/vals.length;if(sc>score){score=sc;best=c}}if(score<.35)return[];for(const r of rows){if(r[best]!=null){const q=parsePerson(r[best]);if(q.surname)out.push(q)}}return out}
async function readWorkbook(file){const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});let out=[];for(const s of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[s],{defval:''});out=out.concat(rowsToPeople(rows))}return out}
function tokenMatch(q,c){if(!q)return true;if(!c)return false;return q.length===1?c.startsWith(q):q===c}
function matchOne(qtxt){const q=parsePerson(qtxt);if(!q.surname)return[];const m=new Map();for(const p of PEOPLE){const k=[p.surname,p.name,p.patronymic].join('|');if(!m.has(k))m.set(k,{p,count:0});m.get(k).count++}let cand=[];for(const {p,count} of m.values()){if(p.surname===q.surname&&tokenMatch(q.name,p.name)&&tokenMatch(q.patronymic,p.patronymic))cand.push({p,count})}if(!cand.length)return[];const fn=q.name&&q.name.length>1,fp=q.patronymic&&q.patronymic.length>1,ini=q.name&&q.name.length===1,inp=q.patronymic&&q.patronymic.length===1;return cand.map(x=>({found:disp(x.p),count:x.count,status:fn&&fp?'Точний збіг':ini&&inp?(cand.length===1?'Впевнено: прізвище + ініціали':'Неоднозначно'):(cand.length===1?'Імовірний варіант':'Неоднозначно')}))}
excel.onchange=async()=>{statusBox.className='status';if(!excel.files[0])return;try{PEOPLE=await readWorkbook(excel.files[0]);peopleBox.innerHTML='';for(const p of PEOPLE){const d=document.createElement('div');d.className='person';d.textContent=disp(p);d.onclick=()=>queries.value+=(queries.value.trim()?'\n':'')+d.textContent;peopleBox.appendChild(d)}$('fileInfo').textContent=`${excel.files[0].name} — записів: ${PEOPLE.length}`;statusBox.textContent='Excel прочитано.'}catch(e){statusBox.className='status error';statusBox.textContent='Не вдалося прочитати Excel: '+e.message}}
$('loadList').onclick=async()=>{const f=$('queryFile').files[0];if(!f){statusBox.className='status error';statusBox.textContent='Виберіть файл зі списком.';return}try{const ext=f.name.toLowerCase().split('.').pop();let lines=[];if(ext==='txt'||ext==='csv'){const t=await f.text();lines=t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}else{const buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});for(const s of wb.SheetNames){const a=XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,defval:''});for(const r of a){const v=r.find(x=>String(x).trim());if(v)lines.push(String(v).trim())}}}queries.value=lines.join('\n');statusBox.className='status';statusBox.textContent=`Завантажено: ${lines.length}` }catch(e){statusBox.className='status error';statusBox.textContent=e.message}}
$('start').onclick=()=>{results.innerHTML='';if(!PEOPLE.length){statusBox.className='status error';statusBox.textContent='Спочатку виберіть Excel.';return}const qs=queries.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let n=1;for(const q of qs){const mm=matchOne(q);if(!mm.length){results.insertAdjacentHTML('beforeend',`<tr><td>${n++}</td><td>${q}</td><td></td><td>0</td><td>Не знайдено</td></tr>`)}else{for(const r of mm){results.insertAdjacentHTML('beforeend',`<tr><td>${n++}</td><td>${q}</td><td>${r.found}</td><td>${r.count}</td><td>${r.status}</td></tr>`)}}}statusBox.className='status';statusBox.textContent=`Готово. Рядків результату: ${n-1}`}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
